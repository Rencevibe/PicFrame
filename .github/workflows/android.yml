name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests, debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug 2>&1 | tee gradle.log
      - name: Report Gradle failure as annotations
        if: failure()
        run: |
          grep -E -A25 "What went wrong|^e: |FAILED$|error:" gradle.log | head -60 \
            | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
