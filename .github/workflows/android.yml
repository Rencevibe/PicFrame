name: Android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sha=$(curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256)
          echo "::notice title=gradle-9.6.0-bin sha256::$sha"
